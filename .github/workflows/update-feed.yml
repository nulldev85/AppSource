name: Update app source feed

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-feed.yml"
      - "scripts/**"
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source feed
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Mirror app releases and generate signer feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REPOS_TOKEN: ${{ secrets.SOURCE_REPOS_TOKEN }}
        run: python scripts/update_feed.py

      - name: Commit feed and icon changes
        run: |
          git add apps.json icons/
          if git diff --cached --quiet; then
            echo "No distribution changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update app source feed"
          git push
