name: Update app source feed

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-feed.yml"
      - "scripts/**"
      - "release-notes.json"
      - "tests/**"
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source feed
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate release notes and publishing contracts
        run: python -m unittest discover -s tests -b

      - name: Mirror app releases and generate signer feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REPOS_TOKEN: ${{ secrets.SOURCE_REPOS_TOKEN }}
        run: python scripts/update_feed.py

      - name: Commit feed and icon changes
        id: commit
        run: |
          git add apps.json icons/
          if git diff --cached --quiet; then
            echo "No distribution changes."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          apps_changed="false"
          if ! git diff --cached --quiet -- apps.json; then
            apps_changed="true"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update app source feed"
          git push
          echo "updated=$apps_changed" >> "$GITHUB_OUTPUT"

      - name: Announce new builds in Discord
        if: steps.commit.outputs.updated == 'true'
        env:
          DISCORD_RELEASES_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASES_WEBHOOK_URL }}
          DISCORD_RELEASES_ROLE_ID: ${{ vars.DISCORD_RELEASES_ROLE_ID }}
        run: python scripts/notify_discord.py --previous HEAD~1:apps.json --current apps.json
